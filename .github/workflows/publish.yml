name: Publish nuget packages
on:
  push:
    tags:
      - '*.*.*'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v2
      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: 8.0.302
      - name: Setup .NET 7.0
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: 7.0.410
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Pack
        env:
          NUGET_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: ./publish-nuget.sh "https://api.nuget.org/v3/index.json" "$NUGET_KEY" "${GITHUB_REF##*/}"
